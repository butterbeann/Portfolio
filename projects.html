<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=4">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">Teresa Ross Tellechea</a>
    <div class="header-controls">
      <nav aria-label="Primary navigation">
        <a href="index.html" data-i18n="navAbout">About</a>
        <a href="projects.html" aria-current="page" data-i18n="navWork">Selected Work</a>
      </nav>

      <div class="language-switcher" aria-label="Language">
        <button type="button" class="language-button is-active" data-language="en"
                aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" class="language-button" data-language="es"
                aria-pressed="false">ES</button>
      </div>
    </div>
  </header>

  <main>
    <section class="projects-intro minimal-projects-intro">
      <h1 data-i18n="workHeading">Selected Work</h1>
      <p data-i18n="workInstruction">Select an image to learn more about the project.</p>
      
    </section>

    <section class="project-grid" aria-label="Selected subtitle projects">

      <article class="project-card">
        <button class="project-toggle" type="button" aria-expanded="false">
          <span class="project-image project-image-1" role="img"
                aria-label="Still from a Spanish-language Laurel and Hardy short"></span>
          
          <span class="project-description">
<span class="project-title" data-i18n="lhTitle">Laurel &amp; Hardy</span>
            <span class="project-meta" data-i18n="lhMeta">Film Forum · 2026</span>
            <span class="project-role" data-i18n="lhRole">Spanish → English · Subtitle translation and live soft-titling</span>
            <span class="project-copy" data-i18n="lhCopy">
              Prepared English subtitles for select screenings of rarely shown
              Spanish-language Laurel &amp; Hardy shorts during Film Forum's
              Laurel &amp; Hardy festival. The work included translating dialogue,
              adapting songs and period humor, preparing the subtitles for
              Subtival, and manually advancing them from the booth during projection.
            </span>
            <a class="project-link"
               href="https://filmforum.org/film/politiquerias-laurel-hardy"
               target="_blank" rel="noopener" data-i18n="learnMore">Learn more →</a>
            <span class="project-close" data-i18n="backToImage">back to image</span>
          </span>
        </button>
      </article>

      <article class="project-card">
        <button class="project-toggle" type="button" aria-expanded="false">
          <span class="project-image project-image-2" role="img"
                aria-label="Still from Ann Demeulemeester Spring Summer 2026 behind the scenes film"></span>
          
          <span class="project-description">
<span class="project-title" data-i18n="annTitle">Ann Demeulemeester Spring / Summer 2026 BTS</span>
            <span class="project-meta" data-i18n="annMeta">Silken Weinberg · 2026 · 8 min</span>
            <span class="project-role" data-i18n="annRole">English subtitles · Translation editing and timing</span>
            <span class="project-copy" data-i18n="annCopy">
              Created English captions for a behind-the-scenes film documenting
              the development of a fashion collection. The captions were carefully
              timed and edited to support comprehension while remaining visually
              unobtrusive and aligned with the film's pacing and aesthetic.
            </span>
            <a class="project-link"
               href="https://www.youtube.com/watch?v=oNmz93XrPeE&t=122s"
               target="_blank" rel="noopener" data-i18n="learnMore">Learn more →</a>
            <span class="project-close" data-i18n="backToImage">back to image</span>
          </span>
        </button>
      </article>

      <article class="project-card">
        <button class="project-toggle" type="button" aria-expanded="false">
          <span class="project-image project-image-3" role="img"
                aria-label="Still from Outrider"></span>
          
          <span class="project-description">
<span class="project-title"><em data-i18n="outriderTitle">Outrider</em></span>
            <span class="project-meta" data-i18n="outriderMeta">Alystyre Julian · 2025 · 101 min</span>
            <span class="project-role" data-i18n="outriderRole">English → Spanish · Subtitle translation and timing</span>
            <span class="project-copy" data-i18n="outriderCopy">
              Created Spanish subtitles from scratch for an independent feature
              composed largely of spoken-word poetry, including translation,
              timing, line breaks, and quality control. Although an AI-generated
              draft was provided, the poetic language and non-standard dialogue
              structure required a complete rebuild. Cultural references and
              poetic phrasing were adapted while preserving tone and rhythm.
            </span>
            <a class="project-link"
               href="https://www.outriderfilm.com"
               target="_blank" rel="noopener" data-i18n="learnMore">Learn more →</a>
            <span class="project-close" data-i18n="backToImage">back to image</span>
          </span>
        </button>
      </article>

      <article class="project-card">
        <button class="project-toggle" type="button" aria-expanded="false">
          <span class="project-image project-image-4" role="img"
                aria-label="Still from A Biography of Lilith"></span>
          
          <span class="project-description">
<span class="project-title"><em data-i18n="lilithTitle">A Biography of Lilith</em></span>
            <span class="project-meta" data-i18n="lilithMeta">Lynne Sachs · 1997 · 35 min</span>
            <span class="project-role" data-i18n="lilithRole">English → Spanish · Subtitle revision</span>
            <span class="project-copy" data-i18n="lilithCopy">
              Revised and corrected Spanish subtitles for the film's 4K
              restoration, which screened at the Ambulante Documentary Film
              Festival in Mexico City in April 2024. The work involved refining
              translation accuracy, improving linguistic consistency, and
              adapting subtitles for clarity and readability in a festival
              exhibition context.
            </span>
            <a class="project-link"
               href="http://www.lynnesachs.com/1997/06/15/a-biography-of-lilith/"
               target="_blank" rel="noopener" data-i18n="learnMore">Learn more →</a>
            <span class="project-close" data-i18n="backToImage">back to image</span>
          </span>
        </button>
      </article>

    </section>
  </main>

  <footer>
    <p><span data-i18n="footerService">English ⇄ Spanish subtitling</span> · <span data-i18n="location">New York City</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
